<!DOCTYPE html>
<html>

<head>

<meta name="viewport"
      content="width=device-width,initial-scale=1">

<title>Barcode / QR Scanner</title>

<script src="https://unpkg.com/html5-qrcode"></script>

<style>

body{
    font-family:Arial,Helvetica,sans-serif;
    text-align:center;
    padding:20px;
    margin:0;
    background:#ffffff;
}

h2{
    margin:10px 0 20px 0;
}

button{
    padding:12px 22px;
    font-size:17px;
    margin:5px;
    cursor:pointer;
    border-radius:8px;
    border:1px solid #888;
    background:#f5f5f5;
}

button:disabled{
    opacity:0.5;
    cursor:not-allowed;
}

#reader{
    width:100%;
    max-width:500px;
    margin:20px auto;
}

#result{
    margin-top:20px;
    font-size:20px;
    font-weight:bold;
    word-break:break-all;
}

#status{
    margin-top:10px;
    font-size:15px;
}

#formats{
    max-width:500px;
    margin:20px auto;
    text-align:left;
    font-size:14px;
    line-height:1.6;
}

</style>

</head>


<body>


<h2>
📷 Barcode / QR Scanner
</h2>


<div>

<button
    id="startButton"
    onclick="startScanner()">
    START SCANNER
</button>


<button
    id="closeButton"
    onclick="closeScanner()">
    CLOSE
</button>

</div>


<div id="reader"></div>


<div id="result">
Ready
</div>


<div id="status">
Scanner is ready
</div>


<div id="formats">

<b>Supported formats:</b>

<br>

QR Code<br>
Code 128<br>
Code 39<br>
Code 93<br>
Codabar<br>
EAN-13<br>
EAN-8<br>
UPC-A<br>
UPC-E<br>
ITF<br>
Data Matrix<br>
PDF417<br>
Aztec

</div>


<script>


/* ==========================================
   GLOBAL VARIABLES
========================================== */

var scanner = null;

var scannerRunning = false;

var scanned = false;


/* ==========================================
   START SCANNER
========================================== */

function startScanner(){

    if(scannerRunning){

        return;

    }


    scanned = false;


    document.getElementById("result").innerText =
        "Starting camera...";


    document.getElementById("status").innerText =
        "Requesting camera permission...";


    document.getElementById("startButton").disabled =
        true;


    /*
     * Create scanner
     */

    scanner = new Html5Qrcode(
        "reader"
    );


    /*
     * Only use format constants
     * that actually exist in the
     * loaded html5-qrcode library.
     */

    var formats = [];


    if(
        typeof Html5QrcodeSupportedFormats !==
        "undefined"
    ){

        var availableFormats = [

            "QR_CODE",

            "CODE_128",

            "CODE_39",

            "CODE_93",

            "CODABAR",

            "EAN_13",

            "EAN_8",

            "UPC_A",

            "UPC_E",

            "ITF",

            "DATA_MATRIX",

            "PDF_417",

            "AZTEC"

        ];


        availableFormats.forEach(
            function(name){

                if(
                    typeof Html5QrcodeSupportedFormats[name]
                    !== "undefined"
                ){

                    formats.push(
                        Html5QrcodeSupportedFormats[name]
                    );

                }

            }
        );

    }


    /*
     * Scanner configuration
     */

    var config = {

        fps:10,

        qrbox:{
            width:250,
            height:150
        }

    };


    /*
     * Only add formatsToSupport
     * if valid formats exist.
     */

    if(formats.length > 0){

        config.formatsToSupport =
            formats;

    }


    /*
     * Start rear camera
     */

    scanner.start(

        {
            facingMode:"environment"
        },

        config,


        function(decodedText, decodedResult){

            /*
             * Prevent duplicate results
             */

            if(scanned){

                return;

            }


            scanned = true;


            console.log(
                "SCAN RESULT:",
                decodedText
            );


            document.getElementById(
                "result"
            ).innerText =
                "Scanned: " + decodedText;


            document.getElementById(
                "status"
            ).innerText =
                "Scan successful";


            /*
             * Stop camera
             */

            stopScanner(

                function(){

                    sendResultToApp(
                        decodedText
                    );

                }

            );

        },


        function(errorMessage){

            /*
             * Normal scanning errors
             * are ignored.
             */

        }

    )


    .then(function(){

        scannerRunning = true;


        document.getElementById(
            "result"
        ).innerText =
            "Scanning...";


        document.getElementById(
            "status"
        ).innerText =
            "Point camera at Barcode / QR Code";


        document.getElementById(
            "startButton"
        ).disabled =
            false;

    })


    .catch(function(error){

        scannerRunning = false;


        document.getElementById(
            "startButton"
        ).disabled =
            false;


        console.log(
            "Camera error:",
            error
        );


        document.getElementById(
            "result"
        ).innerText =
            "Camera error";


        document.getElementById(
            "status"
        ).innerText =
            error.message ||
            error;

    });

}


/* ==========================================
   STOP SCANNER
========================================== */

function stopScanner(callback){

    if(
        !scanner ||
        !scannerRunning
    ){

        scannerRunning = false;


        if(callback){

            callback();

        }

        return;

    }


    scanner.stop()

    .then(function(){

        scannerRunning = false;


        console.log(
            "Scanner stopped"
        );


        if(callback){

            callback();

        }

    })


    .catch(function(error){

        scannerRunning = false;


        console.log(
            "Scanner stop error:",
            error
        );


        /*
         * Even if camera stop fails,
         * continue the process.
         */

        if(callback){

            callback();

        }

    });

}


/* ==========================================
   SEND RESULT TO APP SCRIPT
========================================== */

function sendResultToApp(decodedText){

    if(window.opener){

        window.opener.postMessage(

            {
                type:"barcodeScan",
                value:decodedText
            },

            "*"

        );

        setTimeout(function(){

            window.close();

        },500);

        return;

    }

    document.getElementById(
        "status"
    ).innerText =
        "Scanned: " +
        decodedText;

}
      
/* ==========================================
   CLOSE BUTTON
========================================== */

function closeScanner(){

    document.getElementById(
        "status"
    ).innerText =
        "Closing scanner...";


    /*
     * Stop camera first
     */

    stopScanner(

        function(){

            returnToApp();

        }

    );

}


/* ==========================================
   RETURN TO APP
========================================== */

function returnToApp(){

    if(window.opener){

        window.opener.postMessage(

            {
                type:"scannerClose"
            },

            "*"

        );

        setTimeout(function(){

            window.close();

        },300);

        return;

    }

}
      
/* ==========================================
   PAGE LOAD
========================================== */

window.addEventListener(
    "load",
    function(){

        console.log(
            "Scanner page loaded"
        );

    }
);

      function getReturnUrl(){

    var params =
        new URLSearchParams(
            window.location.search
        );

    return params.get("returnUrl");

}

      function getReturnUrl(){

  var params =
    new URLSearchParams(
      window.location.search
    );

  return params.get("returnUrl");

}

</script>


</body>

</html>
