<!DOCTYPE html>
<html>

<head>

<meta name="viewport"
      content="width=device-width,initial-scale=1">

<title>Barcode / QR Scanner</title>

<script src="https://unpkg.com/html5-qrcode"></script>

<style>

body{
    font-family:Arial,Helvetica,sans-serif;
    text-align:center;
    padding:20px;
    margin:0;
    background:#ffffff;
}

h2{
    margin:10px 0 20px 0;
}

button{
    padding:12px 22px;
    font-size:17px;
    margin:5px;
    cursor:pointer;
    border-radius:8px;
    border:1px solid #888;
    background:#f5f5f5;
}

button:disabled{
    opacity:0.5;
    cursor:not-allowed;
}

#reader{
    width:100%;
    max-width:500px;
    margin:20px auto;
}

#result{
    margin-top:20px;
    font-size:20px;
    font-weight:bold;
    word-break:break-all;
}

#status{
    margin-top:10px;
    font-size:15px;
}

#formats{
    max-width:500px;
    margin:20px auto;
    text-align:left;
    font-size:14px;
    line-height:1.6;
}

</style>

</head>


<body>


<h2>
📷 Barcode / QR Scanner
</h2>


<div>

<button
    id="startButton"
    onclick="startScanner()">
    START SCANNER
</button>


<button
    id="flashButton"
    onclick="toggleFlash()"
    disabled>
    🔦 FLASHLIGHT
</button>


<button
    id="closeButton"
    onclick="closeScanner()">
    CLOSE
</button>

</div>


<div id="reader"></div>


<div id="result">
Ready
</div>


<div id="status">
Scanner is ready
</div>


<div id="formats">

<b>Supported formats:</b>

<br>

QR Code<br>
Code 128<br>
Code 39<br>
Code 93<br>
Codabar<br>
EAN-13<br>
EAN-8<br>
UPC-A<br>
UPC-E<br>
ITF<br>
Data Matrix<br>
PDF417<br>
Aztec

</div>


<script>


/* ==========================================
   GLOBAL VARIABLES
========================================== */

var scanner = null;

var scannerRunning = false;

var scanned = false;

var flashOn = false;

var cameraTrack = null;


/* ==========================================
   GET SCANNER MODE
========================================== */

function getScannerMode(){

    var params =
        new URLSearchParams(
            window.location.search
        );


    var mode =
        params.get("mode");


    console.log(
        "SCANNER MODE =",
        mode
    );


    return mode;

}


/* ==========================================
   START SCANNER
========================================== */

function startScanner(){

    if(scannerRunning){

        return;

    }


    scanned = false;

    flashOn = false;

    cameraTrack = null;


    document.getElementById(
        "result"
    ).innerText =
        "Starting camera...";


    document.getElementById(
        "status"
    ).innerText =
        "Requesting camera permission...";


    document.getElementById(
        "startButton"
    ).disabled =
        true;


    document.getElementById(
        "flashButton"
    ).disabled =
        true;


    /*
     * Create scanner
     */

    scanner =
        new Html5Qrcode(
            "reader"
        );


    /*
     * Supported formats
     */

    var formats = [];


    if(
        typeof Html5QrcodeSupportedFormats !==
        "undefined"
    ){

        var availableFormats = [

            "QR_CODE",

            "CODE_128",

            "CODE_39",

            "CODE_93",

            "CODABAR",

            "EAN_13",

            "EAN_8",

            "UPC_A",

            "UPC_E",

            "ITF",

            "DATA_MATRIX",

            "PDF_417",

            "AZTEC"

        ];


        availableFormats.forEach(
            function(name){

                if(
                    typeof
                    Html5QrcodeSupportedFormats[name]
                    !== "undefined"
                ){

                    formats.push(
                        Html5QrcodeSupportedFormats[name]
                    );

                }

            }
        );

    }


    /*
     * Scanner configuration
     */

    var config = {

        fps:10,

        qrbox:{
            width:250,
            height:150
        }

    };


    /*
     * Add formats if available
     */

    if(formats.length > 0){

        config.formatsToSupport =
            formats;

    }


    /*
     * Start rear camera
     */

    scanner.start(

        {
            facingMode:"environment"
        },

        config,


        function(
            decodedText,
            decodedResult
        ){

            /*
             * Prevent duplicate results
             */

            if(scanned){

                return;

            }


            scanned = true;


            console.log(
                "SCAN RESULT:",
                decodedText
            );


            document.getElementById(
                "result"
            ).innerText =
                "Scanned: " +
                decodedText;


            document.getElementById(
                "status"
            ).innerText =
                "Scan successful";


            /*
             * Turn flash OFF
             */

            turnFlashOff();


            /*
             * Stop camera
             */

            stopScanner(

                function(){

                    sendResultToApp(
                        decodedText
                    );

                }

            );

        },


        function(errorMessage){

            /*
             * Normal scanning errors
             * are ignored.
             */

        }

    )


    .then(function(){

        scannerRunning = true;


        /*
         * Get camera video track
         */

        try{

            var videoElement =
                document.querySelector(
                    "#reader video"
                );


            if(videoElement){

                var stream =
                    videoElement.srcObject;


                if(stream){

                    var tracks =
                        stream.getVideoTracks();


                    if(
                        tracks &&
                        tracks.length > 0
                    ){

                        cameraTrack =
                            tracks[0];

                    }

                }

            }

        }catch(error){

            console.log(
                "Cannot get camera track:",
                error
            );

        }


        /*
         * Enable flashlight button
         */

        document.getElementById(
            "flashButton"
        ).disabled = false;


        document.getElementById(
            "startButton"
        ).disabled = false;


        document.getElementById(
            "result"
        ).innerText =
            "Scanning...";


        document.getElementById(
            "status"
        ).innerText =
            "Point camera at Barcode / QR Code";


        /*
         * Check flashlight support
         */

        checkFlashSupport();

    })


    .catch(function(error){

        scannerRunning = false;

        cameraTrack = null;


        document.getElementById(
            "startButton"
        ).disabled =
            false;


        document.getElementById(
            "flashButton"
        ).disabled =
            true;


        console.log(
            "Camera error:",
            error
        );


        document.getElementById(
            "result"
        ).innerText =
            "Camera error";


        document.getElementById(
            "status"
        ).innerText =
            error.message ||
            error;

    });

}


/* ==========================================
   CHECK FLASH SUPPORT
========================================== */

function checkFlashSupport(){

    if(!cameraTrack){

        console.log(
            "No camera track"
        );

        return;

    }


    try{

        var capabilities =
            cameraTrack.getCapabilities();


        console.log(
            "CAMERA CAPABILITIES =",
            capabilities
        );


        if(
            capabilities &&
            capabilities.torch
        ){

            console.log(
                "FLASHLIGHT SUPPORTED"
            );

            document.getElementById(
                "status"
            ).innerText =
                "Scanner ready - Flashlight available";

        }else{

            console.log(
                "FLASHLIGHT NOT SUPPORTED"
            );

        }

    }catch(error){

        console.log(
            "Flash support check error:",
            error
        );

    }

}


/* ==========================================
   TOGGLE FLASH
========================================== */

function toggleFlash(){

    if(!scannerRunning){

        alert(
            "Please start scanner first."
        );

        return;

    }


    if(!cameraTrack){

        alert(
            "Camera track not available."
        );

        return;

    }


    try{

        var capabilities =
            cameraTrack.getCapabilities();


        if(
            !capabilities ||
            !capabilities.torch
        ){

            alert(
                "⚠️ Flashlight is not supported on this device/browser."
            );

            return;

        }


        flashOn =
            !flashOn;


        cameraTrack.applyConstraints({

            advanced:[
                {
                    torch:flashOn
                }
            ]

        })

        .then(function(){

            console.log(
                "FLASH =",
                flashOn
            );


            if(flashOn){

                document.getElementById(
                    "flashButton"
                ).innerText =
                    "🔦 FLASH ON";


                document.getElementById(
                    "status"
                ).innerText =
                    "Flashlight ON";

            }else{

                document.getElementById(
                    "flashButton"
                ).innerText =
                    "🔦 FLASHLIGHT";


                document.getElementById(
                    "status"
                ).innerText =
                    "Flashlight OFF";

            }

        })

        .catch(function(error){

            console.log(
                "Flashlight error:",
                error
            );


            flashOn = false;


            document.getElementById(
                "flashButton"
            ).innerText =
                "🔦 FLASHLIGHT";


            alert(
                "⚠️ Cannot control flashlight on this device."
            );

        });

    }catch(error){

        console.log(
            "Flashlight error:",
            error
        );


        alert(
            "⚠️ Flashlight is not supported."
        );

    }

}


/* ==========================================
   TURN FLASH OFF
========================================== */

function turnFlashOff(){

    if(
        !cameraTrack ||
        !flashOn
    ){

        return;

    }


    try{

        cameraTrack.applyConstraints({

            advanced:[
                {
                    torch:false
                }
            ]

        })

        .catch(function(error){

            console.log(
                "Cannot turn flash off:",
                error
            );

        });

    }catch(error){

        console.log(
            "Flash off error:",
            error
        );

    }


    flashOn = false;


    var flashButton =
        document.getElementById(
            "flashButton"
        );


    if(flashButton){

        flashButton.innerText =
            "🔦 FLASHLIGHT";

    }

}


/* ==========================================
   STOP SCANNER
========================================== */

function stopScanner(callback){

    /*
     * Save scanner reference
     */

    var currentScanner =
        scanner;


    /*
     * Immediately mark scanner
     * as no longer running
     */

    scannerRunning = false;

    cameraTrack = null;


    /*
     * Disable flashlight
     */

    var flashButton =
        document.getElementById(
            "flashButton"
        );


    if(flashButton){

        flashButton.disabled =
            true;

    }


    /*
     * IMPORTANT
     *
     * Do NOT wait for scanner.stop()
     * before returning to Apps Script.
     *
     * iPhone Safari may hang here.
     */


    if(callback){

        callback();

    }


    /*
     * Stop camera in background
     */

    if(
        currentScanner &&
        typeof currentScanner.stop ===
        "function"
    ){

        try{

            currentScanner
                .stop()

                .then(function(){

                    console.log(
                        "Scanner stopped"
                    );

                })

                .catch(function(error){

                    console.log(
                        "Scanner stop error =",
                        error
                    );

                });

        }catch(error){

            console.log(
                "Scanner stop exception =",
                error
            );

        }

    }

}


/* ==========================================
   SEND RESULT TO APP
========================================== */

function sendResultToApp(decodedText){

    decodedText =
        String(
            decodedText || ""
        ).trim();


    var mode =
        getScannerMode();


    var returnUrl =
        getReturnUrl();


    console.log(
        "================================"
    );

    console.log(
        "SEND SCAN RESULT"
    );

    console.log(
        "VALUE =",
        decodedText
    );

    console.log(
        "MODE =",
        mode
    );

    console.log(
        "RETURN URL =",
        returnUrl
    );

    console.log(
        "================================"
    );


    /*
     * =====================================
     * RETURN TO APPS SCRIPT
     * PRIMARY METHOD
     * =====================================
     */

    if(returnUrl){

        var separator =
            returnUrl.indexOf("?") >= 0
                ? "&"
                : "?";


        var finalUrl =
            returnUrl +
            separator +
            "scanResult=" +
            encodeURIComponent(
                decodedText
            ) +
            "&scanMode=" +
            encodeURIComponent(
                mode || ""
            );


        console.log(
            "FINAL RETURN URL =",
            finalUrl
        );


        /*
         * IMPORTANT
         *
         * location.replace()
         * instead of window.close()
         */

        window.location.replace(
            finalUrl
        );


        return;

    }


    /*
     * =====================================
     * FALLBACK
     * =====================================
     */

    if(window.opener){

        try{

            window.opener.postMessage(

                {

                    type:
                        "barcodeScan",

                    value:
                        decodedText,

                    mode:
                        mode

                },

                "*"

            );


            setTimeout(function(){

                window.close();

            },500);


            return;

        }catch(error){

            console.log(
                "postMessage ERROR =",
                error
            );

        }

    }


    document.getElementById(
        "status"
    ).innerText =
        "Scanned: " +
        decodedText;

}

/* ==========================================
   CLOSE BUTTON
========================================== */

function closeScanner(){

    document.getElementById(
        "status"
    ).innerText =
        "Closing scanner...";


    /*
     * Stop camera first
     */

    stopScanner(

        function(){

            returnToApp();

        }

    );

}

/* ==========================================
   GET RETURN URL
========================================== */

function getReturnUrl(){

    var params =
        new URLSearchParams(
            window.location.search
        );


    var returnUrl =
        params.get(
            "returnUrl"
        );


    console.log(
        "GET RETURN URL =",
        returnUrl
    );


    return returnUrl;

}
      
/* ==========================================
   RETURN TO APP
========================================== */

function returnToApp(){

    var returnUrl =
        getReturnUrl();


    console.log(
        "RETURN TO APP"
    );


    console.log(
        "RETURN URL =",
        returnUrl
    );


    /*
     * =====================================
     * PRIMARY METHOD
     * RETURN BY URL
     * =====================================
     */

    if(returnUrl){

        console.log(
            "RETURNING TO APPS SCRIPT BY URL"
        );


        window.location.replace(
            returnUrl
        );


        return;

    }


    /*
     * =====================================
     * FALLBACK
     * window.opener
     * =====================================
     */

    if(window.opener){

        try{

            window.opener.postMessage(

                {

                    type:
                        "scannerClose"

                },

                "*"

            );


            setTimeout(function(){

                window.close();

            },300);


            return;

        }catch(error){

            console.log(
                "RETURN ERROR =",
                error
            );

        }

    }


    /*
     * =====================================
     * NO RETURN URL
     * =====================================
     */

    document.getElementById(
        "status"
    ).innerText =
        "Cannot return to app.";

}

</script>


</body>

</html>
