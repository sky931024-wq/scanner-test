<!DOCTYPE html>
<html>

<head>

<meta name="viewport"
      content="width=device-width,initial-scale=1">

<title>Barcode / QR Scanner</title>

<script src="https://unpkg.com/html5-qrcode"></script>

<style>

body{

    font-family:
        Arial,
        Helvetica,
        sans-serif;

    text-align:center;

    padding:20px;

    margin:0;

    background:#ffffff;

}

h2{

    margin:
        10px 0
        20px 0;

}

button{

    -webkit-appearance:none;

    appearance:none;

    padding:
        12px 22px;

    font-size:17px;

    margin:5px;

    cursor:pointer;

    border-radius:8px;

    border:
        1px solid #888;

    background:#f5f5f5;

    color:#000;

    font-family:
        Arial,
        Helvetica,
        sans-serif;

}

button:disabled{

    opacity:0.5;

    cursor:not-allowed;

}

#reader{

    width:100%;

    max-width:500px;

    margin:
        20px auto;

}

#result{

    margin-top:20px;

    font-size:20px;

    font-weight:bold;

    word-break:break-all;

}

#status{

    margin-top:10px;

    font-size:15px;

}

#formats{

    max-width:500px;

    margin:
        20px auto;

    text-align:left;

    font-size:14px;

    line-height:1.6;

}

</style>

</head>


<body>


<h2>
📷 Barcode / QR Scanner
</h2>


<div>

<button
    id="startButton"
    onclick="startScanner()">

    START SCANNER

</button>


<button
    id="flashButton"
    onclick="toggleFlash()"
    disabled>

    🔦 FLASHLIGHT

</button>


<button
    id="closeButton"
    onclick="closeScanner()">

    CLOSE

</button>

</div>


<div id="reader"></div>


<div id="result">

Ready

</div>


<div id="status">

Scanner is ready

</div>


<div id="formats">

<b>Supported formats:</b>

<br>

QR Code<br>
Code 128<br>
Code 39<br>
Code 93<br>
Codabar<br>
EAN-13<br>
EAN-8<br>
UPC-A<br>
UPC-E<br>
ITF<br>
Data Matrix<br>
PDF417<br>
Aztec

</div>


<script>


/* ==========================================
   GLOBAL VARIABLES
========================================== */

var scanner = null;

var scannerRunning = false;

var scanned = false;

var flashOn = false;

var cameraTrack = null;


/* ==========================================
   GET PARAMETER
========================================== */

function getParameter(name){

    var params =
        new URLSearchParams(
            window.location.search
        );

    return params.get(name);

}


/* ==========================================
   GET SCANNER MODE
========================================== */

function getScannerMode(){

    return getParameter("mode");

}


/* ==========================================
   GET RETURN URL
========================================== */

function getReturnUrl(){

    return getParameter("returnUrl");

}


/* ==========================================
   START SCANNER
========================================== */

function startScanner(){

    if(scannerRunning){

        return;

    }


    scanned = false;

    flashOn = false;

    cameraTrack = null;


    document.getElementById(
        "result"
    ).innerText =
        "Starting camera...";


    document.getElementById(
        "status"
    ).innerText =
        "Requesting camera permission...";


    document.getElementById(
        "startButton"
    ).disabled =
        true;


    document.getElementById(
        "flashButton"
    ).disabled =
        true;


    scanner =
        new Html5Qrcode(
            "reader"
        );


    var formats = [];


    if(
        typeof Html5QrcodeSupportedFormats
        !== "undefined"
    ){

        var availableFormats = [

            "QR_CODE",
            "CODE_128",
            "CODE_39",
            "CODE_93",
            "CODABAR",
            "EAN_13",
            "EAN_8",
            "UPC_A",
            "UPC_E",
            "ITF",
            "DATA_MATRIX",
            "PDF_417",
            "AZTEC"

        ];


        availableFormats.forEach(
            function(name){

                if(
                    typeof
                    Html5QrcodeSupportedFormats[name]
                    !== "undefined"
                ){

                    formats.push(
                        Html5QrcodeSupportedFormats[name]
                    );

                }

            }
        );

    }


    var config = {

        fps:10,

        qrbox:{

            width:250,

            height:150

        }

    };


    if(formats.length > 0){

        config.formatsToSupport =
            formats;

    }


    scanner.start(

        {
            facingMode:"environment"
        },

        config,


        function(
            decodedText,
            decodedResult
        ){

            if(scanned){

                return;

            }


            scanned = true;


            decodedText =
                String(
                    decodedText || ""
                ).trim();


            console.log(
                "================================"
            );

            console.log(
                "SCAN SUCCESS"
            );

            console.log(
                "VALUE =",
                decodedText
            );

            console.log(
                "MODE =",
                getScannerMode()
            );

            console.log(
                "RETURN URL =",
                getReturnUrl()
            );

            console.log(
                "WINDOW OPENER =",
                window.opener
            );

            console.log(
                "================================"
            );


            document.getElementById(
                "result"
            ).innerText =
                "Scanned: " +
                decodedText;


            document.getElementById(
                "status"
            ).innerText =
                "Returning to APP...";


            /*
             * Stop camera
             */

            stopScanner(

                function(){

                    /*
                     * Send result
                     */

                    sendResultToApp(
                        decodedText
                    );

                }

            );

        },


        function(errorMessage){

            /*
             * Normal scan errors.
             * Ignore.
             */

        }

    )

    .then(function(){

        scannerRunning = true;


        /*
         * Get camera track
         */

        try{

            var videoElement =
                document.querySelector(
                    "#reader video"
                );


            if(videoElement){

                var stream =
                    videoElement.srcObject;


                if(stream){

                    var tracks =
                        stream.getVideoTracks();


                    if(
                        tracks &&
                        tracks.length > 0
                    ){

                        cameraTrack =
                            tracks[0];

                    }

                }

            }

        }catch(error){

            console.log(
                "Camera track error:",
                error
            );

        }


        document.getElementById(
            "flashButton"
        ).disabled =
            false;


        document.getElementById(
            "startButton"
        ).disabled =
            false;


        document.getElementById(
            "result"
        ).innerText =
            "Scanning...";


        document.getElementById(
            "status"
        ).innerText =
            "Point camera at Barcode / QR Code";


        checkFlashSupport();

    })

    .catch(function(error){

        scannerRunning = false;

        cameraTrack = null;


        document.getElementById(
            "startButton"
        ).disabled =
            false;


        document.getElementById(
            "flashButton"
        ).disabled =
            true;


        console.log(
            "Camera error:",
            error
        );


        document.getElementById(
            "result"
        ).innerText =
            "Camera error";


        document.getElementById(
            "status"
        ).innerText =
            error.message ||
            error;

    });

}


/* ==========================================
   CHECK FLASH SUPPORT
========================================== */

function checkFlashSupport(){

    if(!cameraTrack){

        return;

    }


    try{

        var capabilities =
            cameraTrack.getCapabilities();


        if(
            capabilities &&
            capabilities.torch
        ){

            console.log(
                "FLASHLIGHT SUPPORTED"
            );

        }

    }catch(error){

        console.log(
            "Flash support error:",
            error
        );

    }

}


/* ==========================================
   TOGGLE FLASH
========================================== */

function toggleFlash(){

    if(!scannerRunning){

        alert(
            "Please start scanner first."
        );

        return;

    }


    if(!cameraTrack){

        alert(
            "Camera track not available."
        );

        return;

    }


    try{

        var capabilities =
            cameraTrack.getCapabilities();


        if(
            !capabilities ||
            !capabilities.torch
        ){

            alert(
                "⚠️ Flashlight is not supported on this device/browser."
            );

            return;

        }


        flashOn =
            !flashOn;


        cameraTrack.applyConstraints({

            advanced:[
                {
                    torch:
                        flashOn
                }
            ]

        })

        .then(function(){

            if(flashOn){

                document.getElementById(
                    "flashButton"
                ).innerText =
                    "🔦 FLASH ON";


                document.getElementById(
                    "status"
                ).innerText =
                    "Flashlight ON";

            }else{

                document.getElementById(
                    "flashButton"
                ).innerText =
                    "🔦 FLASHLIGHT";


                document.getElementById(
                    "status"
                ).innerText =
                    "Flashlight OFF";

            }

        })

        .catch(function(error){

            console.log(
                "Flashlight error:",
                error
            );


            flashOn = false;

        });

    }catch(error){

        console.log(
            "Flashlight error:",
            error
        );

    }

}


/* ==========================================
   TURN FLASH OFF
========================================== */

function turnFlashOff(){

    if(
        !cameraTrack ||
        !flashOn
    ){

        return;

    }


    try{

        cameraTrack.applyConstraints({

            advanced:[
                {
                    torch:false
                }
            ]

        });

    }catch(error){

        console.log(
            "Flash off error:",
            error
        );

    }


    flashOn = false;


    var button =
        document.getElementById(
            "flashButton"
        );


    if(button){

        button.innerText =
            "🔦 FLASHLIGHT";

    }

}


/* ==========================================
   STOP SCANNER
========================================== */

function stopScanner(callback){

    turnFlashOff();


    if(
        !scanner ||
        !scannerRunning
    ){

        scannerRunning = false;

        cameraTrack = null;


        if(callback){

            callback();

        }

        return;

    }


    scanner.stop()

    .then(function(){

        scannerRunning = false;

        cameraTrack = null;


        document.getElementById(
            "flashButton"
        ).disabled =
            true;


        console.log(
            "Scanner stopped"
        );


        if(callback){

            callback();

        }

    })

    .catch(function(error){

        console.log(
            "Scanner stop error:",
            error
        );


        scannerRunning = false;

        cameraTrack = null;


        document.getElementById(
            "flashButton"
        ).disabled =
            true;


        /*
         * Even if camera stop fails,
         * continue.
         */

        if(callback){

            callback();

        }

    });

}


/* ==========================================
   SEND RESULT TO APP
========================================== */

function sendResultToApp(decodedText){

    decodedText =
        String(
            decodedText || ""
        ).trim();


    var mode =
        getScannerMode();


    var returnUrl =
        getReturnUrl();


    console.log(
        "================================"
    );

    console.log(
        "SEND RESULT"
    );

    console.log(
        "VALUE =",
        decodedText
    );

    console.log(
        "MODE =",
        mode
    );

    console.log(
        "RETURN URL =",
        returnUrl
    );

    console.log(
        "OPENER =",
        window.opener
    );

    console.log(
        "================================"
    );


    /*
     * =====================================
     * METHOD 1
     * window.opener
     * =====================================
     */

    if(window.opener){

        try{

            window.opener.postMessage(

                {

                    type:
                        "barcodeScan",

                    value:
                        decodedText,

                    mode:
                        mode

                },

                "*"

            );


            console.log(
                "✅ RESULT SENT BY postMessage"
            );


            /*
             * Close this scanner tab
             */

            setTimeout(function(){

                window.close();

            },500);


            return;

        }catch(error){

            console.log(
                "postMessage failed:",
                error
            );

        }

    }


    /*
     * =====================================
     * METHOD 2
     * RETURN URL
     * =====================================
     */

    if(returnUrl){

        var separator =
            returnUrl.indexOf("?") >= 0
                ? "&"
                : "?";


        var finalUrl =
            returnUrl +
            separator +
            "scanResult=" +
            encodeURIComponent(
                decodedText
            ) +
            "&scanMode=" +
            encodeURIComponent(
                mode || ""
            );


        console.log(
            "RETURN BY URL:"
        );


        console.log(
            finalUrl
        );


        document.getElementById(
            "status"
        ).innerText =
            "Returning to APP...";


        window.location.replace(
            finalUrl
        );


        return;

    }


    /*
     * =====================================
     * NO RETURN METHOD
     * =====================================
     */

    document.getElementById(
        "status"
    ).innerText =
        "Cannot return to APP.";

}


/* ==========================================
   CLOSE SCANNER
========================================== */

function closeScanner(){

    console.log(
        "================================"
    );

    console.log(
        "CLOSE SCANNER"
    );

    console.log(
        "OPENER =",
        window.opener
    );

    console.log(
        "RETURN URL =",
        getReturnUrl()
    );

    console.log(
        "================================"
    );


    document.getElementById(
        "status"
    ).innerText =
        "Returning to APP...";


    /*
     * Stop camera first
     */

    stopScanner(

        function(){

            /*
             * =================================
             * METHOD 1
             * WINDOW OPENER
             * =================================
             */

            if(window.opener){

                try{

                    window.opener.postMessage(

                        {

                            type:
                                "scannerClose"

                        },

                        "*"

                    );


                    console.log(
                        "✅ CLOSE SENT BY postMessage"
                    );


                    setTimeout(function(){

                        window.close();

                    },500);


                    return;

                }catch(error){

                    console.log(
                        "Close postMessage failed:",
                        error
                    );

                }

            }


            /*
             * =================================
             * METHOD 2
             * RETURN URL
             * =================================
             */

            var returnUrl =
                getReturnUrl();


            if(returnUrl){

                console.log(
                    "RETURN CLOSE BY URL"
                );


                window.location.replace(
                    returnUrl
                );


                return;

            }


            /*
             * =================================
             * NO RETURN
             * =================================
             */

            document.getElementById(
                "status"
            ).innerText =
                "Cannot return to APP.";

        }

    );

}


/* ==========================================
   PAGE LOAD
========================================== */

window.addEventListener(
    "load",
    function(){

        var mode =
            getScannerMode();


        var returnUrl =
            getReturnUrl();


        console.log(
            "================================"
        );

        console.log(
            "SCANNER PAGE LOADED"
        );

        console.log(
            "MODE =",
            mode
        );

        console.log(
            "RETURN URL =",
            returnUrl
        );

        console.log(
            "OPENER =",
            window.opener
        );

        console.log(
            "================================"
        );


        if(returnUrl){

            document.getElementById(
                "status"
            ).innerText =
                "Scanner ready";

        }else{

            document.getElementById(
                "status"
            ).innerText =
                "RETURN URL NOT FOUND";

        }

    }
);


</script>


</body>

</html>
