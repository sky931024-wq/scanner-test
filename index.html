<!DOCTYPE html>
<html>

<head>

<meta name="viewport"
      content="width=device-width,initial-scale=1">

<title>Barcode Scanner</title>

<script src="https://unpkg.com/html5-qrcode"></script>

<style>

body{
    font-family:Arial;
    text-align:center;
    padding:20px;
}

#reader{
    width:100%;
    max-width:500px;
    margin:20px auto;
}

button{
    padding:12px 25px;
    font-size:18px;
}

#result{
    margin-top:20px;
    font-size:20px;
    font-weight:bold;
}

</style>

</head>

<body>

<h2>📷 Barcode / QR Scanner</h2>

<button onclick="startScanner()">
START SCANNER
</button>

<div id="reader"></div>

<div id="result"></div>


<script>

var scanner = null;
var scanned = false;


function startScanner(){

    scanned = false;

    document.getElementById("result").innerText =
        "Scanning...";


    scanner = new Html5Qrcode("reader");


    scanner.start(

        {
            facingMode:"environment"
        },

        {
            fps:10,

            qrbox:{
                width:250,
                height:150
            }

        },

        function(decodedText){

            if(scanned){
                return;
            }

            scanned = true;


            document.getElementById("result").innerText =
                "Scanned: " + decodedText;


            console.log(
                "SCAN RESULT:",
                decodedText
            );


            scanner.stop().then(function(){

                console.log(
                    "Scanner stopped"
                );


                /*
                 * Send result back to
                 * App Script page
                 */

if(window.opener){

    window.opener.postMessage(

        {
            type:"barcodeScan",
            value:decodedText
        },

        "*"

    );

    setTimeout(function(){

        window.close();

    },500);

}

            });


        },

        function(errorMessage){

            // scanning continuously
            // ignore normal scan errors

        }

    )

    .catch(function(error){

        console.log(error);

        document.getElementById("result").innerText =
            "Camera error: " + error;

    });

}

</script>

</body>

</html>
