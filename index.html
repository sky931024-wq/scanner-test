<!DOCTYPE html>
<html>

<head>

<meta name="viewport"
      content="width=device-width,initial-scale=1">

<title>Barcode / QR Scanner</title>

<script src="https://unpkg.com/html5-qrcode"></script>

<style>

body{
    font-family:Arial,Helvetica,sans-serif;
    text-align:center;
    padding:20px;
    margin:0;
}

h2{
    margin-bottom:15px;
}

button{
    padding:12px 22px;
    font-size:17px;
    margin:5px;
    cursor:pointer;
    border-radius:8px;
    border:1px solid #888;
    background:#f5f5f5;
}

#reader{
    width:100%;
    max-width:500px;
    margin:20px auto;
}

#result{
    margin-top:20px;
    font-size:20px;
    font-weight:bold;
    word-break:break-all;
}

#formats{
    max-width:500px;
    margin:20px auto;
    text-align:left;
    font-size:14px;
    line-height:1.6;
}

</style>

</head>


<body>


<h2>
📷 Barcode / QR Scanner
</h2>


<button onclick="startScanner()">
START SCANNER
</button>


<button onclick="closeScanner()">
CLOSE
</button>


<div id="reader"></div>


<div id="result">
Ready
</div>


<div id="formats">

<b>Supported formats:</b>

<br>

QR Code<br>
Code 128<br>
Code 39<br>
Code 93<br>
Codabar<br>
EAN-13<br>
EAN-8<br>
UPC-A<br>
UPC-E<br>
ITF<br>
Data Matrix<br>
PDF417<br>
Aztec

</div>


<script>


var scanner = null;

var scanned = false;

var scannerRunning = false;


/* ==========================================
   START SCANNER
========================================== */

function startScanner(){

    if(scannerRunning){

        return;

    }


    scanned = false;


    document.getElementById("result").innerText =
        "Starting camera...";


    scanner =
        new Html5Qrcode("reader");


    /*
     * Ask library to use all supported formats
     */

    var formatsToSupport = [

        Html5QrcodeSupportedFormats.QR_CODE,

        Html5QrcodeSupportedFormats.CODE_128,

        Html5QrcodeSupportedFormats.CODE_39,

        Html5QrcodeSupportedFormats.CODE_93,

        Html5QrcodeSupportedFormats.CODABAR,

        Html5QrcodeSupportedFormats.EAN_13,

        Html5QrcodeSupportedFormats.EAN_8,

        Html5QrcodeSupportedFormats.UPC_A,

        Html5QrcodeSupportedFormats.UPC_E,

        Html5QrcodeSupportedFormats.ITF,

        Html5QrcodeSupportedFormats.DATA_MATRIX,

        Html5QrcodeSupportedFormats.PDF_417,

        Html5QrcodeSupportedFormats.AZTEC

    ];


    scanner.start(

        {
            facingMode:"environment"
        },


        {

            fps:10,

            qrbox:{
                width:250,
                height:150
            },

            formatsToSupport:
                formatsToSupport

        },


        function(decodedText, decodedResult){

            /*
             * Prevent duplicate scanning
             */

            if(scanned){

                return;

            }


            scanned = true;


            document.getElementById("result").innerText =
                "Scanned: " + decodedText;


            console.log(
                "SCAN RESULT:",
                decodedText
            );


            stopScannerAndReturn(
                decodedText
            );


        },


        function(errorMessage){

            /*
             * Normal scanning errors
             * are ignored.
             */

        }

    )


    .then(function(){

        scannerRunning = true;


        document.getElementById("result").innerText =
            "Scanning...";


    })


    .catch(function(error){

        scannerRunning = false;


        console.log(
            "Camera error:",
            error
        );


        document.getElementById("result").innerText =
            "Camera error: " + error;

    });

}


/* ==========================================
   STOP SCANNER + SEND RESULT
========================================== */

function stopScannerAndReturn(decodedText){

    if(!scanner){

        sendResultToApp(decodedText);

        return;

    }


    scanner.stop()

    .then(function(){

        scannerRunning = false;


        console.log(
            "Scanner stopped"
        );


        sendResultToApp(
            decodedText
        );


    })


    .catch(function(error){

        scannerRunning = false;


        console.log(
            "Scanner stop error:",
            error
        );


        /*
         * Even if stop fails,
         * still send result.
         */

        sendResultToApp(
            decodedText
        );

    });

}


/* ==========================================
   SEND RESULT TO APP SCRIPT
========================================== */

function sendResultToApp(decodedText){

    console.log(
        "Sending result to App Script:",
        decodedText
    );


    if(window.opener){

        window.opener.postMessage(

            {

                type:"barcodeScan",

                value:decodedText

            },

            "*"

        );


        /*
         * Give App Script a moment
         * to receive the result.
         */

        setTimeout(function(){

            window.close();

        },800);

    }

    else{

        /*
         * No opener detected.
         */

        document.getElementById("result").innerText =
            "Scanned: " + decodedText;

    }

}


/* ==========================================
   CLOSE BUTTON
========================================== */

function closeScanner(){

    /*
     * Stop camera first
     */

    if(scanner && scannerRunning){

        scanner.stop()

        .then(function(){

            scannerRunning = false;

            returnToApp();

        })

        .catch(function(error){

            console.log(
                "Stop error:",
                error
            );

            scannerRunning = false;

            returnToApp();

        });

    }

    else{

        returnToApp();

    }

}


/* ==========================================
   RETURN TO APP SCRIPT
========================================== */

function returnToApp(){

    console.log(
        "Returning to App Script"
    );


    if(window.opener){

        window.opener.postMessage(

            {

                type:"scannerClose"

            },

            "*"

        );


        setTimeout(function(){

            window.close();

        },300);

    }

    else{

        document.getElementById("result").innerText =
            "Please close this window.";

    }

}


</script>


</body>

</html>
