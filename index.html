<!DOCTYPE html>
<html>

<head>

<meta name="viewport"
      content="width=device-width,initial-scale=1">

<title>Barcode / QR Scanner</title>

<script src="https://unpkg.com/html5-qrcode"></script>


<style>

/* ==========================================
   BODY
========================================== */

body{

    font-family:
        Arial,
        Helvetica,
        sans-serif;

    text-align:center;

    padding:20px;

    margin:0;

    background:#ffffff;

}


/* ==========================================
   TITLE
========================================== */

h2{

    margin:
        10px 0
        20px 0;

}


/* ==========================================
   BUTTON
   IMPORTANT FOR IPHONE SAFARI
========================================== */

button{

    -webkit-appearance:none;

    appearance:none;

    padding:
        12px 22px;

    font-size:17px;

    margin:5px;

    cursor:pointer;

    border-radius:8px;

    border:
        1px solid #888;

    background:#f5f5f5;

    color:#000;

    font-family:
        Arial,
        Helvetica,
        sans-serif;

}


/* ==========================================
   BUTTON DISABLED
========================================== */

button:disabled{

    opacity:0.5;

    cursor:not-allowed;

}


/* ==========================================
   READER
========================================== */

#reader{

    width:100%;

    max-width:500px;

    margin:
        20px auto;

}


/* ==========================================
   RESULT
========================================== */

#result{

    margin-top:20px;

    font-size:20px;

    font-weight:bold;

    word-break:break-all;

}


/* ==========================================
   STATUS
========================================== */

#status{

    margin-top:10px;

    font-size:15px;

}


/* ==========================================
   FORMATS
========================================== */

#formats{

    max-width:500px;

    margin:
        20px auto;

    text-align:left;

    font-size:14px;

    line-height:1.6;

}

</style>

</head>


<body>


<h2>
📷 Barcode / QR Scanner
</h2>


<!-- ========================================
     BUTTONS
========================================= -->

<div>

<button
    id="startButton"
    onclick="startScanner()">

    START SCANNER

</button>


<button
    id="flashButton"
    onclick="toggleFlash()"
    disabled>

    🔦 FLASHLIGHT

</button>


<button
    id="closeButton"
    onclick="closeScanner()">

    CLOSE

</button>

</div>


<!-- ========================================
     SCANNER
========================================= -->

<div id="reader"></div>


<!-- ========================================
     RESULT
========================================= -->

<div id="result">

Ready

</div>


<!-- ========================================
     STATUS
========================================= -->

<div id="status">

Scanner is ready

</div>


<!-- ========================================
     SUPPORTED FORMATS
========================================= -->

<div id="formats">

<b>Supported formats:</b>

<br>

QR Code<br>
Code 128<br>
Code 39<br>
Code 93<br>
Codabar<br>
EAN-13<br>
EAN-8<br>
UPC-A<br>
UPC-E<br>
ITF<br>
Data Matrix<br>
PDF417<br>
Aztec

</div>


<script>


/* ==========================================
   GLOBAL VARIABLES
========================================== */

var scanner = null;

var scannerRunning = false;

var scanned = false;

var flashOn = false;

var cameraTrack = null;


/* ==========================================
   GET SCANNER MODE
========================================== */

function getScannerMode(){

    var params =
        new URLSearchParams(
            window.location.search
        );


    var mode =
        params.get(
            "mode"
        );


    console.log(
        "SCANNER MODE =",
        mode
    );


    return mode;

}


/* ==========================================
   GET RETURN URL
========================================== */

function getReturnUrl(){

    var params =
        new URLSearchParams(
            window.location.search
        );

    return params.get(
        "returnUrl"
    );

}


    console.log(
        "RETURN URL =",
        returnUrl
    );


    return returnUrl;

}


/* ==========================================
   START SCANNER
========================================== */

function startScanner(){

    if(scannerRunning){

        return;

    }


    scanned = false;

    flashOn = false;

    cameraTrack = null;


    document.getElementById(
        "result"
    ).innerText =
        "Starting camera...";


    document.getElementById(
        "status"
    ).innerText =
        "Requesting camera permission...";


    document.getElementById(
        "startButton"
    ).disabled =
        true;


    document.getElementById(
        "flashButton"
    ).disabled =
        true;


    /*
     * =====================================
     * CREATE SCANNER
     * =====================================
     */

    scanner =
        new Html5Qrcode(
            "reader"
        );


    /*
     * =====================================
     * SUPPORTED FORMATS
     * =====================================
     */

    var formats = [];


    if(
        typeof
        Html5QrcodeSupportedFormats
        !== "undefined"
    ){

        var availableFormats = [

            "QR_CODE",

            "CODE_128",

            "CODE_39",

            "CODE_93",

            "CODABAR",

            "EAN_13",

            "EAN_8",

            "UPC_A",

            "UPC_E",

            "ITF",

            "DATA_MATRIX",

            "PDF_417",

            "AZTEC"

        ];


        availableFormats.forEach(
            function(name){

                if(
                    typeof
                    Html5QrcodeSupportedFormats[name]
                    !== "undefined"
                ){

                    formats.push(
                        Html5QrcodeSupportedFormats[name]
                    );

                }

            }
        );

    }


    /*
     * =====================================
     * SCANNER CONFIG
     * =====================================
     */

    var config = {

        fps:10,

        qrbox:{

            width:250,

            height:150

        }

    };


    /*
     * =====================================
     * ADD SUPPORTED FORMATS
     * =====================================
     */

    if(
        formats.length > 0
    ){

        config.formatsToSupport =
            formats;

    }


    /*
     * =====================================
     * START REAR CAMERA
     * =====================================
     */

    scanner.start(

        {
            facingMode:"environment"
        },

        config,


        /*
         * ==================================
         * SCAN SUCCESS
         * ==================================
         */

        function(
            decodedText,
            decodedResult
        ){

            /*
             * Prevent duplicate scans
             */

            if(scanned){

                return;

            }


            scanned = true;


            console.log(
                "================================"
            );

            console.log(
                "SCAN SUCCESS"
            );

            console.log(
                "DECODED TEXT =",
                decodedText
            );

            console.log(
                "================================"
            );


            document.getElementById(
                "result"
            ).innerText =
                "Scanned: " +
                decodedText;


            document.getElementById(
                "status"
            ).innerText =
                "Returning to APP...";


            /*
             * Turn flashlight OFF
             */

            turnFlashOff();


            /*
             * Stop camera first
             */

            stopScanner(

                function(){

                    /*
                     * IMPORTANT
                     *
                     * After camera stops,
                     * directly return by URL.
                     *
                     * Do NOT use window.opener.
                     * Do NOT use window.close().
                     */

                    sendResultToApp(
                        decodedText
                    );

                }

            );

        },


        /*
         * ==================================
         * SCAN ERROR
         * ==================================
         */

        function(errorMessage){

            /*
             * Normal scan errors
             * are ignored.
             */

        }

    )


    /*
     * =====================================
     * CAMERA STARTED
     * =====================================
     */

    .then(function(){

        scannerRunning = true;


        /*
         * Get camera video track
         */

        try{

            var videoElement =
                document.querySelector(
                    "#reader video"
                );


            if(videoElement){

                var stream =
                    videoElement.srcObject;


                if(stream){

                    var tracks =
                        stream.getVideoTracks();


                    if(
                        tracks &&
                        tracks.length > 0
                    ){

                        cameraTrack =
                            tracks[0];

                    }

                }

            }

        }catch(error){

            console.log(
                "Cannot get camera track:",
                error
            );

        }


        /*
         * Enable flashlight
         */

        document.getElementById(
            "flashButton"
        ).disabled =
            false;


        /*
         * Enable START button
         */

        document.getElementById(
            "startButton"
        ).disabled =
            false;


        /*
         * Update result
         */

        document.getElementById(
            "result"
        ).innerText =
            "Scanning...";


        /*
         * Update status
         */

        document.getElementById(
            "status"
        ).innerText =
            "Point camera at Barcode / QR Code";


        /*
         * Check flashlight
         */

        checkFlashSupport();

    })


    /*
     * =====================================
     * CAMERA ERROR
     * =====================================
     */

    .catch(function(error){

        scannerRunning = false;

        cameraTrack = null;


        document.getElementById(
            "startButton"
        ).disabled =
            false;


        document.getElementById(
            "flashButton"
        ).disabled =
            true;


        console.log(
            "Camera error:",
            error
        );


        document.getElementById(
            "result"
        ).innerText =
            "Camera error";


        document.getElementById(
            "status"
        ).innerText =
            error.message ||
            error;

    });

}


/* ==========================================
   CHECK FLASH SUPPORT
========================================== */

function checkFlashSupport(){

    if(!cameraTrack){

        console.log(
            "No camera track"
        );

        return;

    }


    try{

        var capabilities =
            cameraTrack.getCapabilities();


        console.log(
            "CAMERA CAPABILITIES =",
            capabilities
        );


        if(
            capabilities &&
            capabilities.torch
        ){

            console.log(
                "FLASHLIGHT SUPPORTED"
            );

        }else{

            console.log(
                "FLASHLIGHT NOT SUPPORTED"
            );

        }

    }catch(error){

        console.log(
            "Flash support check error:",
            error
        );

    }

}


/* ==========================================
   TOGGLE FLASH
========================================== */

function toggleFlash(){

    if(!scannerRunning){

        alert(
            "Please start scanner first."
        );

        return;

    }


    if(!cameraTrack){

        alert(
            "Camera track not available."
        );

        return;

    }


    try{

        var capabilities =
            cameraTrack.getCapabilities();


        if(
            !capabilities ||
            !capabilities.torch
        ){

            alert(
                "⚠️ Flashlight is not supported on this device/browser."
            );

            return;

        }


        flashOn =
            !flashOn;


        cameraTrack.applyConstraints({

            advanced:[

                {
                    torch:
                        flashOn
                }

            ]

        })

        .then(function(){

            console.log(
                "FLASH =",
                flashOn
            );


            if(flashOn){

                document.getElementById(
                    "flashButton"
                ).innerText =
                    "🔦 FLASH ON";


                document.getElementById(
                    "status"
                ).innerText =
                    "Flashlight ON";

            }else{

                document.getElementById(
                    "flashButton"
                ).innerText =
                    "🔦 FLASHLIGHT";


                document.getElementById(
                    "status"
                ).innerText =
                    "Flashlight OFF";

            }

        })

        .catch(function(error){

            console.log(
                "Flashlight error:",
                error
            );


            flashOn = false;


            document.getElementById(
                "flashButton"
            ).innerText =
                "🔦 FLASHLIGHT";


            alert(
                "⚠️ Cannot control flashlight on this device."
            );

        });

    }catch(error){

        console.log(
            "Flashlight error:",
            error
        );


        alert(
            "⚠️ Flashlight is not supported."
        );

    }

}


/* ==========================================
   TURN FLASH OFF
========================================== */

function turnFlashOff(){

    if(
        !cameraTrack ||
        !flashOn
    ){

        return;

    }


    try{

        cameraTrack.applyConstraints({

            advanced:[

                {
                    torch:false
                }

            ]

        })

        .catch(function(error){

            console.log(
                "Cannot turn flash off:",
                error
            );

        });

    }catch(error){

        console.log(
            "Flash off error:",
            error
        );

    }


    flashOn = false;


    var flashButton =
        document.getElementById(
            "flashButton"
        );


    if(flashButton){

        flashButton.innerText =
            "🔦 FLASHLIGHT";

    }

}


/* ==========================================
   STOP SCANNER
========================================== */

function stopScanner(callback){

    /*
     * Turn flash off first
     */

    turnFlashOff();


    /*
     * =====================================
     * NO ACTIVE SCANNER
     * =====================================
     */

    if(
        !scanner ||
        !scannerRunning
    ){

        scannerRunning = false;

        cameraTrack = null;


        if(callback){

            callback();

        }

        return;

    }


    /*
     * =====================================
     * STOP CAMERA
     * =====================================
     */

    scanner.stop()

    .then(function(){

        scannerRunning = false;

        cameraTrack = null;


        console.log(
            "Scanner stopped"
        );


        document.getElementById(
            "flashButton"
        ).disabled =
            true;


        if(callback){

            callback();

        }

    })


    .catch(function(error){

        scannerRunning = false;

        cameraTrack = null;


        console.log(
            "Scanner stop error:",
            error
        );


        document.getElementById(
            "flashButton"
        ).disabled =
            true;


        /*
         * Even if stop fails,
         * continue returning.
         */

        if(callback){

            callback();

        }

    });

}


/* ==========================================
   SEND RESULT TO APP
   IMPORTANT:
   USE RETURN URL
   ========================================== */

function sendResultToApp(decodedText){

    decodedText =
        String(decodedText || "").trim();


    var params =
        new URLSearchParams(
            window.location.search
        );


    var returnUrl =
        params.get("returnUrl");


    var mode =
        params.get("mode");


    console.log(
        "=============================="
    );

    console.log(
        "SCAN RESULT =",
        decodedText
    );

    console.log(
        "MODE =",
        mode
    );

    console.log(
        "RETURN URL =",
        returnUrl
    );

    console.log(
        "=============================="
    );


    if(!returnUrl){

        document.getElementById(
            "status"
        ).innerText =
            "ERROR: returnUrl missing";


        alert(
            "ERROR: returnUrl missing"
        );


        return;

    }


    /*
     * Build URL
     */

    var separator =
        returnUrl.indexOf("?") >= 0
            ? "&"
            : "?";


    var finalUrl =
        returnUrl +
        separator +
        "scanResult=" +
        encodeURIComponent(
            decodedText
        ) +
        "&scanMode=" +
        encodeURIComponent(
            mode || ""
        );


    console.log(
        "FINAL URL =",
        finalUrl
    );


    document.getElementById(
        "status"
    ).innerText =
        "Returning to APP...";


    /*
     * VERY IMPORTANT
     *
     * Do not use:
     *
     * window.opener
     * window.close
     *
     */

    setTimeout(function(){

        window.location.assign(
            finalUrl
        );

    },300);

}


/* ==========================================
   CLOSE SCANNER
========================================== */

function closeScanner(){

    document.getElementById(
        "status"
    ).innerText =
        "Returning to APP...";


    var params =
        new URLSearchParams(
            window.location.search
        );


    var returnUrl =
        params.get("returnUrl");


    console.log(
        "CLOSE RETURN URL =",
        returnUrl
    );


    if(!returnUrl){

        alert(
            "ERROR: returnUrl missing"
        );

        return;

    }


    /*
     * Stop camera
     */

    if(
        scanner &&
        scannerRunning
    ){

        scanner.stop()

        .then(function(){

            scannerRunning = false;

            cameraTrack = null;


            window.location.assign(
                returnUrl
            );

        })

        .catch(function(error){

            console.log(
                "Scanner stop error",
                error
            );


            /*
             * Even if camera stop fails,
             * still return.
             */

            window.location.assign(
                returnUrl
            );

        });

    }else{

        window.location.assign(
            returnUrl
        );

    }

}

/* ==========================================
   RETURN TO APP
========================================== */

function returnToApp(){

    var returnUrl =
        getReturnUrl();


    console.log(
        "================================"
    );

    console.log(
        "RETURN TO APP"
    );

    console.log(
        "RETURN URL =",
        returnUrl
    );

    console.log(
        "================================"
    );


    /*
     * =====================================
     * RETURN URL AVAILABLE
     * =====================================
     */

    if(returnUrl){

        console.log(
            "RETURNING TO APPS SCRIPT"
        );


        /*
         * Direct navigation
         *
         * This works without
         * window.opener.
         */

        window.location.href =
            returnUrl;


        return;

    }


    /*
     * =====================================
     * NO RETURN URL
     * =====================================
     */

    document.getElementById(
        "status"
    ).innerText =
        "Cannot return to app.";

}


/* ==========================================
   PAGE LOAD
========================================== */

window.addEventListener(
    "load",
    function(){

        console.log(
            "================================"
        );

        console.log(
            "SCANNER PAGE LOADED"
        );


        var mode =
            getScannerMode();


        var returnUrl =
            getReturnUrl();


        console.log(
            "SCANNER MODE =",
            mode
        );


        console.log(
            "RETURN URL =",
            returnUrl
        );


        console.log(
            "================================"
        );


        /*
         * =================================
         * CHECK RETURN URL
         * =================================
         */

        if(!returnUrl){

            document.getElementById(
                "status"
            ).innerText =
                "RETURN URL NOT FOUND";


            console.log(
                "❌ RETURN URL NOT FOUND"
            );


        }else{

            document.getElementById(
                "status"
            ).innerText =
                "Scanner ready";


            console.log(
                "✅ RETURN URL FOUND"
            );

        }

    }
);

</script>


</body>

</html>
